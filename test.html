<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>D3 Draw Arc</title>
  <!-- 引入 D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <svg id="mySVG" width="400" height="400"></svg>

  <script>
  // 1. 选择 SVG 画布并设置宽高
const width = 400;
const height = 400;
const svg = d3.select("#mySVG")
  .attr("width", width)
  .attr("height", height);

// 定义圆心、内外半径、角度
const centerX = 200;
const centerY = 200;
const innerRadius = 70;
const outerRadius = 100;
const startAngle = 0;
const endAngle = Math.PI / 2;

// 用 d3.arc() 画环形扇形(示例，和你原来的差不多)
const arcGenerator = d3.arc()
  .innerRadius(innerRadius)
  .outerRadius(outerRadius)
  .startAngle(startAngle)
  .endAngle(endAngle);

svg.append("path")
  .attr("d", arcGenerator)
  .attr("fill", "steelblue")
  .attr("transform", `translate(${centerX}, ${centerY})`);

// ---------------------------
// 1. 先算出“角度中点”
// ---------------------------
const midAngle = (startAngle + endAngle) / 2;

// ---------------------------
// 2. 外圆弧中点：半径=outerRadius
// ---------------------------
const outerMidX = centerX + outerRadius * Math.cos(midAngle);
const outerMidY = centerY - outerRadius * Math.sin(midAngle);

// ---------------------------
// 3. 内圆弧中点：半径=innerRadius
// ---------------------------
const innerMidX = centerX + innerRadius * Math.cos(midAngle);
const innerMidY = centerY - innerRadius * Math.sin(midAngle);

// ---------------------------
// 4. 在这两个“弧中点”画小圆标记 + 文字
// ---------------------------
svg.append("circle")
  .attr("cx", outerMidX)
  .attr("cy", outerMidY)
  .attr("r", 4)
  .attr("fill", "red");

svg.append("circle")
  .attr("cx", centerX)
  .attr("cy", centerY)
  .attr("r", 4)
  .attr("fill", "yellow");

svg.append("text")
  .attr("x", outerMidX + 5)
  .attr("y", outerMidY)
  .attr("font-size", 12)
  .text(`外弧中点 (${outerMidX.toFixed(1)}, ${outerMidY.toFixed(1)})`);

svg.append("circle")
  .attr("cx", innerMidX)
  .attr("cy", innerMidY)
  .attr("r", 4)
  .attr("fill", "red");

svg.append("text")
  .attr("x", innerMidX + 5)
  .attr("y", innerMidY)
  .attr("font-size", 12)
  .text(`内弧中点 (${innerMidX.toFixed(1)}, ${innerMidY.toFixed(1)})`);

  </script>

</body>
</html>
